const words=base.slice(0,200);
let current=0,autoPlay=false,autoTimer,startX=0;
const $=id=>document.getElementById(id);
function renderWord(){
 const w=words[current];$("word").textContent=w[0];$("part").textContent=w[1];$("meaning").textContent=w[2];$("image").textContent=w[3];$("counter").textContent=`${current+1} / ${words.length}`;
 const ko = exampleTranslations;
 $("examples").innerHTML=w[4].map((x,i)=>`<div class="example"><div class="example-text"><div>${i+1}. ${x}</div><div style="margin-top:6px;color:#64748b;font-size:.92em">${ko[x] || "한국어 뜻: " + (exampleTranslations[x] || "직접 문맥에 맞게 해석해 보세요.")}</div></div><button class="example-listen" onclick='speak(${JSON.stringify(x)})'>🔊</button></div>`).join("");$("card").scrollTop=0;
}
function speak(text){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}
function speakWord(){speak(words[current][0])}
function animate(dir){const c=$("card");c.style.opacity="0";c.style.transform=dir==="next"?"translateX(-40px)":"translateX(40px)";setTimeout(()=>{renderWord();c.style.transform=dir==="next"?"translateX(40px)":"translateX(-40px)";setTimeout(()=>{c.style.opacity="1";c.style.transform="translateX(0)"},30)},180)}
function nextWord(){current=(current+1)%words.length;animate("next");resetAuto()}
function prevWord(){current=(current-1+words.length)%words.length;animate("prev");resetAuto()}
function startAuto(){clearInterval(autoTimer);if(autoPlay)autoTimer=setInterval(()=>{current=(current+1)%words.length;animate("next")},3000)}
function toggleAuto(){autoPlay=!autoPlay;const b=$("autoBtn");b.textContent=autoPlay?"⏸ 자동재생":"▶ 자동재생 시작";b.classList.toggle("paused",!autoPlay);startAuto()}
function resetAuto(){if(autoPlay)startAuto()}
const area=$("swipeArea");
area.addEventListener("touchstart",e=>startX=e.touches[0].clientX,{passive:true});
area.addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>=50)d<0?nextWord():prevWord()},{passive:true});
area.addEventListener("mousedown",e=>startX=e.clientX);
area.addEventListener("mouseup",e=>{const d=e.clientX-startX;if(Math.abs(d)>=70)d<0?nextWord():prevWord()});
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")nextWord();if(e.key==="ArrowLeft")prevWord()});
