<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEON SURVIVOR: OVERDRIVE</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#050814;color:#eef7ff;font-family:system-ui,sans-serif;display:flex;justify-content:center}main{width:min(960px,100%)}h1{text-align:center;color:#6ffaff;letter-spacing:3px;text-shadow:0 0 20px #00d9ff;margin:4px}header p{text-align:center;color:#9bb3d7}.hud{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.stat{flex:1;min-width:85px;padding:9px 12px;background:#101a30;border:1px solid #284366;border-radius:10px}.stat small{display:block;color:#8fa8ce;font-size:11px}.stat b{font-size:20px}.stage{position:relative;border:1px solid #2d527e;border-radius:14px;overflow:hidden;box-shadow:0 0 35px #00c8ff20}canvas{display:block;width:100%;height:auto;touch-action:none}.overlay{position:absolute;inset:0;background:#030817dc;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px}.panel{max-width:540px}.panel h2{font-size:clamp(26px,5vw,44px);color:#6ffaff;margin:0}.panel p{line-height:1.6;color:#c3d3ed}.buttonrow,.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0}.buttonrow button,.controls button{border:1px solid #52f2ff;background:#142744;color:#eaf5ff;font-weight:800;border-radius:9px;padding:11px 15px;cursor:pointer;touch-action:manipulation}.buttonrow .primary{background:#52f2ff;color:#061222}.hint{text-align:center;color:#8da6cc;font-size:12px;line-height:1.7}.overlay[hidden]{display:none}
</style></head><body><main><header><h1>NEON SURVIVOR</h1><p>OVERDRIVE · 보스전 · 무기 업그레이드 · 상점 · 특수 능력</p></header>
<div class="hud"><div class="stat"><small>SCORE</small><b id="score">0</b></div><div class="stat"><small>BEST</small><b id="best">0</b></div><div class="stat"><small>HP</small><b id="hp">100</b></div><div class="stat"><small>COINS</small><b id="coins">0</b></div><div class="stat"><small>WAVE</small><b id="wave">1</b></div></div>
<div class="stage"><canvas id="game" width="960" height="540"></canvas><div class="overlay" id="overlay"><div class="panel"><h2 id="title">NEON OVERDRIVE</h2><p id="desc">적을 피하고 마우스로 조준해 생존하세요.<br>코인을 모아 무기를 강화하고 5웨이브마다 등장하는 보스를 물리치세요!</p><button class="primary" id="start">작전 시작</button></div></div></div>
<div class="controls"><button data-key="w">▲</button><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button><button id="bomb">💣 폭탄 (Q)</button><button id="dash">⚡ 대시 (E)</button><button id="shop">🛒 상점 (U)</button><button id="pause">Ⅱ 일시정지</button></div>
<p class="hint">WASD / 방향키 이동 · 마우스 조준 · 클릭 또는 스페이스 사격 · Q 폭탄 · E 대시 · U 상점 · P 일시정지 · R 재시작<br>모바일: 방향 버튼으로 이동하고 게임 화면을 터치해 조준/사격</p></main>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),$=id=>document.getElementById(id),W=c.width,H=c.height;
let player,enemies,shots,enemyShots,particles,keys={},mouse={x:700,y:270,down:false},score=0,coins=0,wave=1,frame=0,spawn=0,running=false,paused=false,best=0,bombs=2,dashes=2,damage=1,fireRate=12,fire=0,inv=0,shopOpen=false;
try{best=+(localStorage.getItem('neon-overdrive-best')||0)}catch(e){}
function reset(){player={x:W/2,y:H/2,hp:100,speed:3.5,dash:0,dx:0,dy:0};enemies=[];shots=[];enemyShots=[];particles=[];score=0;coins=0;wave=1;frame=0;spawn=0;bombs=2;dashes=2;damage=1;fireRate=12;fire=0;inv=0;shopOpen=false;hud();draw()}
function hud(){$('score').textContent=score;$('best').textContent=best;$('hp').textContent=Math.max(0,Math.ceil(player.hp));$('coins').textContent=coins;$('wave').textContent=wave}
function overlay(title,desc,button){$('title').textContent=title;$('desc').innerHTML=desc;$('start').textContent=button;$('overlay').hidden=false}
function start(){reset();running=true;paused=false;$('overlay').hidden=true;requestAnimationFrame(loop)}
function end(){running=false;if(score>best){best=score;try{localStorage.setItem('neon-overdrive-best',best)}catch(e){}}hud();overlay('SYSTEM FAILURE','최종 점수 '+score+' · 코인 '+coins+'<br>웨이브 '+wave+'까지 도달했어요. 다시 도전해 보세요!','다시 도전')}
$('start').onclick=()=>{if(running&&paused){paused=false;$('overlay').hidden=true;requestAnimationFrame(loop)}else start()};
function togglePause(){if(!running)return;paused=!paused;if(paused)overlay('PAUSED','작전이 일시정지됐어요.','계속하기');else{$('overlay').hidden=true;requestAnimationFrame(loop)}}
$('pause').onclick=togglePause;
function aim(e){const r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*W;mouse.y=(e.clientY-r.top)/r.height*H}
c.addEventListener('pointermove',aim);c.addEventListener('pointerdown',e=>{aim(e);mouse.down=true;c.setPointerCapture(e.pointerId)});c.addEventListener('pointerup',()=>mouse.down=false);c.addEventListener('pointercancel',()=>mouse.down=false);
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();keys[k]=true;if(k==='p')togglePause();if(k==='q')bomb();if(k==='e')dash();if(k==='u')shop();if(k==='r')start();if(shopOpen&&'12345'.includes(k))buy(+k)});
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.onpointerdown=e=>{e.preventDefault();keys[k]=true};['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
function burst(x,y,color,n=12){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*4;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:20+Math.random()*20,color})}}
function spawnEnemy(){const side=Math.floor(Math.random()*4),x=side===0?-15:side===1?W+15:Math.random()*W,y=side===2?-15:side===3?H+15:Math.random()*H,boss=wave%5===0&&!enemies.some(e=>e.boss);if(boss){enemies.push({x:W/2,y:65,r:36,hp:30+wave*5,max:30+wave*5,speed:1,boss:true,shot:65});burst(W/2,65,'#ff328e',35)}else enemies.push({x,y,r:Math.random()<.25?10:15,hp:Math.random()<.25?1:2+Math.floor(wave/4),speed:1+Math.random()*0.7+wave*.06,boss:false})}
function shoot(){const a=Math.atan2(mouse.y-player.y,mouse.x-player.x);for(let i=0;i<Math.min(5,1+Math.floor((damage-1)/2));i++){const angle=a+(i-(Math.min(5,1+Math.floor((damage-1)/2))-1)/2)*.14;shots.push({x:player.x,y:player.y,vx:Math.cos(angle)*8.5,vy:Math.sin(angle)*8.5,life:80})}fire=fireRate}
function bomb(){if(!running||paused||bombs<=0)return;bombs--;enemies.forEach(e=>e.hp-=12);enemies=enemies.filter(e=>{if(e.hp<=0){kill(e);return false}return true});enemyShots=[];burst(player.x,player.y,'#ffe66b',45);hud()}
function dash(){if(!running||paused||dashes<=0||player.dash>0)return;let dx=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0),dy=(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0);if(!dx&&!dy){dx=mouse.x-player.x;dy=mouse.y-player.y}const d=Math.hypot(dx,dy)||1;player.dx=dx/d;player.dy=dy/d;player.dash=12;dashes--;inv=20;burst(player.x,player.y,'#5cf8ff',14)}
function shop(){if(!running||paused)return;paused=true;shopOpen=true;overlay('NEON ARMORY','코인 '+coins+'<br>1. 강화 탄환 (+1 피해) — 12코인<br>2. 연사 속도 향상 — 15코인<br>3. 회복 (+35 HP) — 10코인<br>4. 폭탄 충전 — 12코인<br>5. 대시 충전 — 10코인<br><br>숫자 1~5로 구매하고 계속하기를 누르세요.','계속 전투')}
function buy(n){const costs=[12,15,10,12,10],cost=costs[n-1];if(coins<cost){overlay('코인이 부족해요','필요 코인: '+cost+' · 현재 코인: '+coins,'계속 전투');return}coins-=cost;if(n===1)damage++;if(n===2)fireRate=Math.max(4,fireRate-2);if(n===3)player.hp=Math.min(100,player.hp+35);if(n===4)bombs++;if(n===5)dashes++;hud();overlay('업그레이드 완료!','강화 '+n+' 적용 · 남은 코인 '+coins,'계속 전투')}
function kill(e){score+=e.boss?250:10;coins+=e.boss?15:1;burst(e.x,e.y,e.boss?'#ff4b98':'#ff4e75',e.boss?36:12);if(score>best){best=score;try{localStorage.setItem('neon-overdrive-best',best)}catch(err){}}}
$('bomb').onclick=bomb;$('dash').onclick=dash;$('shop').onclick=shop;
function draw(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#07152b');g.addColorStop(.55,'#10102d');g.addColorStop(1,'#180d2b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#3c7caa22';for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let i=0;i<65;i++){ctx.fillStyle=i%4?'#456a9b':'#9cfaff';ctx.globalAlpha=.4;ctx.fillRect((i*179+frame*.4)%W,(i*83)%H,2,2)}ctx.globalAlpha=1;
function circle(o,color,glow=12){ctx.save();ctx.shadowBlur=glow;ctx.shadowColor=color;ctx.fillStyle=color;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();ctx.restore()}
enemies.forEach(e=>{circle(e,e.boss?'#ff328e':'#c92758',e.boss?30:18);if(e.boss){ctx.fillStyle='#250a2a';ctx.fillRect(e.x-35,e.y-e.r-17,70,6);ctx.fillStyle='#ff8ac8';ctx.fillRect(e.x-35,e.y-e.r-17,70*Math.max(0,e.hp/e.max),6)}else{circle({x:e.x-4,y:e.y-3,r:3},'#fff1f5',5)}});
shots.forEach(b=>{ctx.strokeStyle='#4cefff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(b.x-b.vx*2,b.y-b.vy*2);ctx.lineTo(b.x,b.y);ctx.stroke()});enemyShots.forEach(b=>circle({x:b.x,y:b.y,r:5},'#ff5aaf',15));particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/40);circle({x:p.x,y:p.y,r:2},p.color,6)});ctx.globalAlpha=1;
if(player){const a=Math.atan2(mouse.y-player.y,mouse.x-player.x);ctx.save();ctx.translate(player.x,player.y);ctx.rotate(a);ctx.shadowBlur=25;ctx.shadowColor='#5df8ff';ctx.fillStyle='#39cde8';ctx.beginPath();ctx.moveTo(20,0);ctx.lineTo(-12,-12);ctx.lineTo(-5,0);ctx.lineTo(-12,12);ctx.closePath();ctx.fill();ctx.restore();if(inv>0){ctx.strokeStyle='#b9ffff';ctx.beginPath();ctx.arc(player.x,player.y,26,0,Math.PI*2);ctx.stroke()}}
ctx.fillStyle='#a8c8e9';ctx.font='bold 13px system-ui';ctx.fillText('SECTOR '+String(wave).padStart(2,'0'),24,28);if(wave%5===0&&enemies.some(e=>e.boss)){ctx.textAlign='center';ctx.fillStyle='#ff8ab6';ctx.font='bold 18px system-ui';ctx.fillText('◆ BOSS ENGAGED ◆',W/2,28);ctx.textAlign='left'}}
function loop(){if(!running||paused)return;frame++;wave=1+Math.floor(score/120);let dx=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0),dy=(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0),m=Math.hypot(dx,dy)||1;if(player.dash>0){player.x+=player.dx*12;player.y+=player.dy*12;player.dash--}else{player.x+=dx/m*player.speed;player.y+=dy/m*player.speed}player.x=Math.max(14,Math.min(W-14,player.x));player.y=Math.max(14,Math.min(H-14,player.y));inv=Math.max(0,inv-1);fire--;if((mouse.down||keys[' '])&&fire<=0)shoot();spawn--;if(spawn<=0){spawnEnemy();spawn=Math.max(14,52-wave*2)}enemies.forEach(e=>{if(e.boss){e.x+=Math.sin(frame*.025)*e.speed*2;e.y=65+Math.sin(frame*.035)*20;e.shot--;if(e.shot<=0){for(let i=0;i<8;i++){const a=i*Math.PI/4;enemyShots.push({x:e.x,y:e.y,vx:Math.cos(a)*2.3,vy:Math.sin(a)*2.3,life:180})}e.shot=75}}else{const a=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(a)*e.speed;e.y+=Math.sin(a)*e.speed}});
shots.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.life--});enemyShots.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.life--});
for(let i=shots.length-1;i>=0;i--){let b=shots[i],hit=false;for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+4){e.hp-=damage;shots.splice(i,1);hit=true;burst(b.x,b.y,'#7afaff',3);if(e.hp<=0){kill(e);enemies.splice(j,1)}break}}if(!hit&&(b.life<=0||b.x<0||b.x>W||b.y<0||b.y>H))shots.splice(i,1)}
for(let i=enemyShots.length-1;i>=0;i--){const b=enemyShots[i];if(Math.hypot(b.x-player.x,b.y-player.y)<20&&inv<=0){enemyShots.splice(i,1);player.hp-=12;inv=25;burst(player.x,player.y,'#ff4778',8)}else if(b.life<=0||b.x<0||b.x>W||b.y<0||b.y>H)enemyShots.splice(i,1)}
for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if(Math.hypot(player.x-e.x,player.y-e.y)<e.r+12&&inv<=0){player.hp-=e.boss?25:18;inv=35;burst(player.x,player.y,'#ff4778',12);if(!e.boss){enemies.splice(i,1);kill(e)}}}
particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--});particles=particles.filter(p=>p.life>0);hud();draw();if(player.hp<=0){end();return}requestAnimationFrame(loop)}
reset();draw();
</script></body></html>
