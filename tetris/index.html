<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>미니 테트리스</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141d35;--line:#2c395d;--text:#f4f7ff;--muted:#9eafd2;--accent:#7c9cff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#19264a 0,#0b1020 60%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);display:flex;justify-content:center;padding:24px 14px}
main{width:min(900px,100%)}header{text-align:center;margin-bottom:20px}h1{margin:0;font-size:clamp(28px,5vw,42px);letter-spacing:2px}header p{color:var(--muted);margin:8px 0 0}.layout{display:grid;grid-template-columns:minmax(260px,300px) minmax(220px,1fr);gap:18px;justify-content:center;align-items:start}.board-wrap{position:relative;padding:10px;background:#080d1b;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px #0005}canvas{display:block;width:100%;height:auto;border-radius:8px;background:#0a1021}.side{display:grid;gap:14px}.panel{background:#141d35cc;border:1px solid var(--line);border-radius:15px;padding:16px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#0d1428;border-radius:11px;padding:12px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:25px}.preview{width:100%;max-width:150px;margin:10px auto 0}.buttons{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #52679f;border-radius:10px;background:#27385f;color:white;font-weight:700;padding:11px 14px;cursor:pointer;font-size:14px}.btn.primary{background:var(--accent);color:#081027;border-color:var(--accent)}.btn:hover{filter:brightness(1.12)}.btn:focus-visible{outline:3px solid white;outline-offset:2px}.help{color:var(--muted);font-size:13px;line-height:1.8}.help kbd{display:inline-block;background:#0a1124;border:1px solid #405079;border-radius:5px;padding:1px 6px;color:#fff;font:inherit}.overlay{position:absolute;inset:10px;display:flex;align-items:center;justify-content:center;text-align:center;background:#080d1bd9;border-radius:8px;padding:20px}.overlay[hidden]{display:none}.overlay h2{margin:0 0 8px;font-size:26px}.overlay p{color:var(--muted);margin:0 0 16px}.mobile-controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.mobile-controls button{padding:13px 0;font-size:20px;touch-action:manipulation}@media(max-width:650px){body{padding:16px 10px}.layout{grid-template-columns:minmax(0,1fr);max-width:360px;margin:auto}.side{grid-template-columns:1fr}.board-wrap{width:min(100%,320px);margin:auto}.panel{padding:13px}.stats{grid-template-columns:repeat(4,1fr)}.stat{padding:9px 6px}.stat strong{font-size:20px}.stat span{font-size:11px}.preview{max-width:120px}}
</style>
</head>
<body><main>
<header><h1>🧱 미니 테트리스</h1><p>블록을 쌓고 줄을 지워 최고 점수에 도전하세요!</p></header>
<div class="layout">
<section><div class="board-wrap"><canvas id="game" width="300" height="600" aria-label="테트리스 게임 보드"></canvas><div id="overlay" class="overlay"><div><h2 id="overlayTitle">준비됐나요?</h2><p id="overlayText">시작 버튼을 눌러 게임을 시작하세요.</p><button id="overlayStart" class="btn primary">게임 시작</button></div></div></div>
<div class="mobile-controls" aria-label="터치 조작"><button class="btn" data-act="left" aria-label="왼쪽">←</button><button class="btn" data-act="rotate" aria-label="회전">↻</button><button class="btn" data-act="down" aria-label="아래">↓</button><button class="btn" data-act="right" aria-label="오른쪽">→</button></div></section>
<aside class="side">
<div class="panel stats"><div class="stat"><span>점수</span><strong id="score">0</strong></div><div class="stat"><span>최고 점수</span><strong id="best">0</strong></div><div class="stat"><span>지운 줄</span><strong id="lines">0</strong></div><div class="stat"><span>레벨</span><strong id="level">1</strong></div></div>
<div class="panel"><strong>다음 블록</strong><canvas id="next" class="preview" width="120" height="100" aria-label="다음 블록"></canvas></div>
<div class="panel"><div class="buttons"><button id="start" class="btn primary">▶ 시작 / 재시작</button><button id="pause" class="btn">Ⅱ 일시정지</button></div><p class="help"><b>키보드 조작</b><br><kbd>←</kbd> <kbd>→</kbd> 이동<br><kbd>↑</kbd> 회전<br><kbd>↓</kbd> 빠르게 내리기<br><kbd>Space</kbd> 즉시 떨어뜨리기<br><kbd>P</kbd> 일시정지 · <kbd>R</kbd> 재시작</p></div>
</aside></div></main>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),nextCanvas=document.getElementById('next'),nctx=nextCanvas.getContext('2d');
const COLS=10,ROWS=20,SIZE=30;
const shapes=[
{m:[[1,1,1,1]],c:'#45d9ef'},
{m:[[1,1],[1,1]],c:'#ffd84d'},
{m:[[0,1,0],[1,1,1]],c:'#b58cff'},
{m:[[1,0,0],[1,1,1]],c:'#ff9d4d'},
{m:[[0,0,1],[1,1,1]],c:'#6d91ff'},
{m:[[0,1,1],[1,1,0]],c:'#65e69a'},
{m:[[1,1,0],[0,1,1]],c:'#ff6e8a'}];
let board,player,next,score,lines,level,best=0,running=false,paused=false,over=false,last=0,acc=0,raf=0;
try{best=Number(localStorage.getItem('miniTetrisBest'))||0}catch(e){}
const $=id=>document.getElementById(id);
function cloneShape(s){return {m:s.m.map(r=>r.slice()),c:s.c}}
function randomPiece(){return cloneShape(shapes[Math.floor(Math.random()*shapes.length)])}
function reset(){board=Array.from({length:ROWS},()=>Array(COLS).fill(null));score=0;lines=0;level=1;player=null;next=randomPiece();over=false;paused=false;running=true;spawn();updateUI();hideOverlay();$('pause').textContent='Ⅱ 일시정지';last=0;acc=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function spawn(){player=next;next=randomPiece();player.x=Math.floor(COLS/2)-Math.ceil(player.m[0].length/2);player.y=0;drawNext();if(collides(player,0,0,player.m)){running=false;over=true;showOverlay('게임 종료','최종 점수: '+score.toLocaleString()+'점')}}
function collides(p,dx,dy,m=p.m){for(let y=0;y<m.length;y++)for(let x=0;x<m[y].length;x++)if(m[y][x]){const nx=p.x+x+dx,ny=p.y+y+dy;if(nx<0||nx>=COLS||ny>=ROWS)return true;if(ny>=0&&board[ny][nx])return true}return false}
function move(dx,dy){if(!running||paused||over)return false;if(!collides(player,dx,dy)){player.x+=dx;player.y+=dy;draw();return true}if(dy>0)lock();return false}
function rotate(){if(!running||paused||over)return;const m=player.m[0].map((_,i)=>player.m.map(r=>r[i]).reverse());for(const k of [0,-1,1,-2,2])if(!collides(player,k,0,m)){player.x+=k;player.m=m;draw();return}}
function lock(){player.m.forEach((r,y)=>r.forEach((v,x)=>{if(v&&player.y+y>=0)board[player.y+y][player.x+x]=player.c}));let cleared=0;for(let y=ROWS-1;y>=0;y--)if(board[y].every(Boolean)){board.splice(y,1);board.unshift(Array(COLS).fill(null));cleared++;y++}if(cleared){score+=[0,100,300,500,800][cleared]*level;lines+=cleared;level=Math.floor(lines/10)+1}updateUI();spawn();draw()}
function hardDrop(){if(!running||paused||over)return;let d=0;while(!collides(player,0,1)){player.y++;d++}score+=d*2;lock()}
function cell(c,x,y,size=SIZE){ctx.fillStyle=c;ctx.fillRect(x*size+1,y*size+1,size-2,size-2);ctx.fillStyle='#ffffff25';ctx.fillRect(x*size+3,y*size+3,size-6,3);ctx.fillStyle='#00000018';ctx.fillRect(x*size+3,y*size+size-6,size-6,3)}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#0a1021';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#ffffff0b';ctx.lineWidth=1;for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*SIZE,0);ctx.lineTo(x*SIZE,canvas.height);ctx.stroke()}for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*SIZE);ctx.lineTo(canvas.width,y*SIZE);ctx.stroke()}board.forEach((r,y)=>r.forEach((c,x)=>{if(c)cell(c,x,y)}));if(player){let ghost={...player,y:player.y};while(!collides(ghost,0,1))ghost.y++;player.m.forEach((r,y)=>r.forEach((v,x)=>{if(v){ctx.fillStyle=player.c+'55';ctx.fillRect((player.x+x)*SIZE+3,(ghost.y+y)*SIZE+3,SIZE-6,SIZE-6)}}));player.m.forEach((r,y)=>r.forEach((v,x)=>{if(v)cell(player.c,player.x+x,player.y+y)}))}}
function drawNext(){nctx.clearRect(0,0,120,100);const m=next.m,s=22,ox=(120-m[0].length*s)/2,oy=(100-m.length*s)/2;for(let y=0;y<m.length;y++)for(let x=0;x<m[y].length;x++)if(m[y][x]){nctx.fillStyle=next.c;nctx.fillRect(ox+x*s+1,oy+y*s+1,s-2,s-2);nctx.fillStyle='#ffffff35';nctx.fillRect(ox+x*s+3,oy+y*s+3,s-6,3)}}
function updateUI(){$('score').textContent=score.toLocaleString();$('lines').textContent=lines;$('level').textContent=level;$('best').textContent=Math.max(best,score).toLocaleString();if(score>best){best=score;try{localStorage.setItem('miniTetrisBest',String(best))}catch(e){}}}
function showOverlay(title,text){$('overlayTitle').textContent=title;$('overlayText').textContent=text;$('overlay').hidden=false}
function hideOverlay(){$('overlay').hidden=true}
function loop(t){if(!running||paused||over){draw();return}if(!last)last=t;acc+=Math.min(t-last,100);last=t;const interval=Math.max(90,800-(level-1)*65);if(acc>=interval){acc=0;if(!collides(player,0,1))player.y++;else lock()}draw();raf=requestAnimationFrame(loop)}
function togglePause(){if(over||!running)return;paused=!paused;if(paused){cancelAnimationFrame(raf);showOverlay('일시정지','계속하려면 아래 버튼 또는 P 키를 누르세요.');$('overlayStart').textContent='계속하기';$('pause').textContent='▶ 계속'}else{hideOverlay();$('overlayStart').textContent='게임 시작';$('pause').textContent='Ⅱ 일시정지';last=0;raf=requestAnimationFrame(loop)}}
function act(a){if(a==='left')move(-1,0);if(a==='right')move(1,0);if(a==='down'){if(move(0,1)){score++;updateUI()}}if(a==='rotate')rotate();if(a==='drop')hardDrop()}
document.addEventListener('keydown',e=>{const keys=['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' ','Spacebar'];if(keys.includes(e.key))e.preventDefault();if(e.repeat&&['ArrowUp',' ','Spacebar'].includes(e.key))return;if(e.key==='ArrowLeft')act('left');else if(e.key==='ArrowRight')act('right');else if(e.key==='ArrowDown')act('down');else if(e.key==='ArrowUp')act('rotate');else if(e.key===' '||e.code==='Space')act('drop');else if(e.key.toLowerCase()==='p')togglePause();else if(e.key.toLowerCase()==='r')reset()});
document.querySelectorAll('[data-act]').forEach(b=>{b.addEventListener('click',()=>act(b.dataset.act));b.addEventListener('touchstart',e=>{e.preventDefault();act(b.dataset.act)},{passive:false})});
$('start').addEventListener('click',reset);$('overlayStart').addEventListener('click',()=>{if(paused){paused=false;hideOverlay();$('pause').textContent='Ⅱ 일시정지';last=0;raf=requestAnimationFrame(loop)}else reset()});$('pause').addEventListener('click',togglePause);
board=Array.from({length:ROWS},()=>Array(COLS).fill(null));next=randomPiece();player=randomPiece();player.x=3;player.y=0;drawNext();draw();updateUI();
})();
</script></body></html>
